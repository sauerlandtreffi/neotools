worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  types {
    application/wasm wasm;
    application/manifest+json webmanifest;
  }
  sendfile on;
  gzip on;
  gzip_types text/plain text/css application/javascript application/json application/wasm image/svg+xml;
  brotli on;
  brotli_types text/plain text/css application/javascript application/json application/wasm image/svg+xml;

  server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "credentialless" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' blob: 'wasm-unsafe-eval' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; worker-src 'self' blob:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    client_max_body_size 64m;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
      proxy_pass http://api:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 180s;
    }

    location / {
      try_files $uri $uri/ $uri.html /index.html;
    }

    location ~* \.wasm$ {
      add_header Content-Type application/wasm;
      add_header Cross-Origin-Resource-Policy "same-origin" always;
    }
  }
}
