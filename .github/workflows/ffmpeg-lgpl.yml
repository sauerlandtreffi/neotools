name: ffmpeg-lgpl

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 1 * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Build LGPL ffmpeg.wasm core
        run: bash packages/tools-media/scripts/build-ffmpeg-lgpl.sh
        env:
          FFMPEG_LGPL_OUT: ${{ github.workspace }}/packages/tools-media/vendor/ffmpeg-lgpl
          FFMPEG_LGPL_LOG: ${{ github.workspace }}/ffmpeg-lgpl-build.log

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-lgpl-core
          path: |
            packages/tools-media/vendor/ffmpeg-lgpl/ffmpeg-core.js
            packages/tools-media/vendor/ffmpeg-lgpl/ffmpeg-core.wasm
            packages/tools-media/vendor/ffmpeg-lgpl/BUILD-INFO.json
            packages/tools-media/vendor/ffmpeg-lgpl/LICENSE.txt

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-lgpl-build-log
          path: ffmpeg-lgpl-build.log

      - name: Publish release assets
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ffmpeg-lgpl
          name: FFmpeg WASM LGPL core
          body: |
            Self-hosted `@ffmpeg/ffmpeg` 0.12-compatible **ESM** core (`createFFmpegCore`) built **without** `--enable-gpl` / x264 / x265.
            Dockerfile: `packages/tools-media/Dockerfile.ffmpeg-lgpl` (derived from ffmpegwasm/ffmpeg.wasm v0.12.10).
            Reproduce: `packages/tools-media/scripts/build-ffmpeg-lgpl.sh`
            Fetch: `node scripts/fetch-ffmpeg-lgpl.mjs`
          files: |
            packages/tools-media/vendor/ffmpeg-lgpl/ffmpeg-core.js
            packages/tools-media/vendor/ffmpeg-lgpl/ffmpeg-core.wasm
            packages/tools-media/vendor/ffmpeg-lgpl/BUILD-INFO.json
            packages/tools-media/vendor/ffmpeg-lgpl/LICENSE.txt
          make_latest: false
